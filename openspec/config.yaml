schema: spec-driven
context: |
  Public, nonpartisan comparison of programmes for the Spanish general election of 2026-11-29.
  Use English for all repository documents, OpenSpec artifacts, code, and comments. Apply ASD-STE100 controlled-language review to technical documents. Public MVP UI/content is Spanish (es-ES). Catalan and optional English are later localization phases.
  Local preview and production must run in Docker containers. The public serving image is static and non-privileged. Cloudflare Free provides DNS and proxy for the Hetzner origin. Plan edge cache, abuse control, load tests, and crawlable source-linked pages.
  MVP is a static site generated by Python 3.14 from human-reviewed, versioned source records.
  Do not assume party programmes already exist or publish uncited political claims.
  Preserve source URL, document hash/version, page/section, review status and correction history.
  No accounts, tracking or user-data storage in the MVP; FastAPI only if later justified by a separate change.
rules:
  proposal:
    - State MVP scope and explicit exclusions.
    - Identify editorial, security, privacy and accessibility risks.
  specs:
    - Express verifiable requirements and scenarios, including missing and conflicting sources.
    - Require source-level traceability and human review for published political claims.
  design:
    - Keep runtime light enough to benchmark on 2 vCPU / 8 GB RAM.
    - Separate untrusted ingestion from the public serving environment.
  tasks:
    - Include tests, editorial review, security checks, reproducible build and rollback.
