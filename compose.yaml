services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELECTION_ID: ${ELECTION_ID:-es-gen-2026}
        QUIZ_MODE: ${QUIZ_MODE:-exploratory}
        BUDGET_BUNDLE: ${BUDGET_BUNDLE:-/app/content/budget/aecc6465af87086748c101fbac6e3e6b63438cf4822c732c45c442a5f0eaab24}
    ports:
      - "${PORT:-127.0.0.1:8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
