name: CI

on:
  push:
    branches: ["main", "dy/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and validate methodology, policies, and source register
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite with pytest
        run: |
          PYTHONPATH="src" pytest -v

      - name: Run test suite with standard library unittest
        run: |
          PYTHONPATH="src" python -m unittest discover -s tests -v

      - name: Validate source register
        run: |
          PYTHONPATH="src" python -m elecciones2026.source_register validate content/sources/register.json
