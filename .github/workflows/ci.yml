name: CI

on:
  push:
    branches: ["main", "dy/**"]
  pull_request:
    branches: ["main"]

# Least-privilege default permissions across all jobs (Task 4.1)
permissions:
  contents: read

jobs:
  validate:
    name: Test, validate schemas, determinism, and security boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for sharing behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify share routes and native/copy fallback behavior (E2.6)
        run: |
          node --check site/app.js
          node --check site/sharing.js
          node --test tests/share_behavior.cjs

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pip-audit

      - name: Python syntax and compile validation
        run: |
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Run test suite with pytest
        run: |
          PYTHONPATH="src" pytest -v

      - name: Run test suite with standard library unittest
        run: |
          PYTHONPATH="src" python -m unittest discover -s tests -v

      - name: Validate source register
        run: |
          PYTHONPATH="src" python -m elecciones2026.source_register validate content/sources/register.json

      - name: Validate schemas and content fixtures
        run: |
          PYTHONPATH="src" python -m elecciones2026.schemas validate-all

      - name: Validate local design tokens
        run: |
          PYTHONPATH="src" python -m elecciones2026.tokens validate site/tokens/tokens.json

      - name: Validate accessible component plan
        run: |
          PYTHONPATH="src" python -m elecciones2026.component_plan validate site/COMPONENT-PLAN.md

      - name: Validate Spanish UI flow and selectors
        run: |
          PYTHONPATH="src" python -m elecciones2026.ui_flow validate site/index.html

      - name: Verify offline source importer CLI
        run: |
          PYTHONPATH="src" python -m elecciones2026.importer --help

      - name: Validate editorial approval gates and build rejection rules
        run: |
          PYTHONPATH="src" python -m elecciones2026.editorial validate-build

      - name: Verify static build determinism
        run: |
          PYTHONPATH="src" python -m elecciones2026.generator check-determinism

      - name: Run deterministic static site build
        run: |
          PYTHONPATH="src" python -m elecciones2026.generator build --output-dir dist/

      - name: Supply-chain dependency security audit (Task 4.2)
        run: |
          pip-audit --desc

      - name: Repository secret scan (Task 4.1)
        run: |
          python -c "
          import os, re, sys
          from pathlib import Path
          patterns = [
              r'-----BEGIN (?:RSA|OPENSSH|EC|DSA) PRIVATE KEY-----',
              r'ghp_[A-Za-z0-9]{36}',
              r'github_pat_[A-Za-z0-9_]{82}',
              r'AKIA[0-9A-Z]{16}',
          ]
          found = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', '.pytest_cache', '__pycache__', 'dist'}]
              for f in files:
                  p = Path(root) / f
                  try:
                      txt = p.read_text(encoding='utf-8', errors='ignore')
                      for pat in patterns:
                          if re.search(pat, txt):
                              print(f'Secret match in {p}: {pat}', file=sys.stderr)
                              found += 1
                  except Exception:
                      pass
          sys.exit(1 if found > 0 else 0)
          "

  mobile-accessibility:
    name: Rendered mobile and keyboard regression checks (E2.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development browser tooling
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Check rendered mobile flow and measure throttled navigation
        run: |
          PYTHONPATH=src python -m elecciones2026.mobile_accessibility --output build/mobile-accessibility.json

      - name: Retain browser observations and review limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-accessibility-e2-5
          path: build/mobile-accessibility.json

  docker-parity:
    name: Build Docker serving image and verify container parity (Task 4.5)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned Docker image via multi-stage builder
        run: |
          docker build -t elecciones2026:ci .

      - name: Run preview container with read-only filesystem and dropped capabilities
        run: |
          docker run -d --rm \
            -p 8080:8080 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --name preview_smoke \
            elecciones2026:ci

      - name: Wait for container HTTP readiness
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null; then
              echo "Container ready after ${i} checks"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to respond within 30s"
          docker logs preview_smoke
          exit 1

      - name: Verify ADR-0001 Cache-Control and security headers
        run: |
          # 1. HTML home route (300s cache, CSP, security headers)
          HTML_HEADERS=$(curl -s -D - http://127.0.0.1:8080/ -o /dev/null)
          echo "$HTML_HEADERS" | grep -i "cache-control:.*max-age=300"
          echo "$HTML_HEADERS" | grep -i "x-content-type-options: nosniff"
          echo "$HTML_HEADERS" | grep -i "x-frame-options: DENY"
          echo "$HTML_HEADERS" | grep -i "content-security-policy:"

          # 2. Immutable static assets (31536000s, immutable)
          CSS_HEADERS=$(curl -s -D - http://127.0.0.1:8080/styles.css -o /dev/null)
          echo "$CSS_HEADERS" | grep -i "cache-control:.*max-age=31536000"
          echo "$CSS_HEADERS" | grep -i "immutable"

          # 3. Crawler policy files (3600s cache)
          ROBOTS_HEADERS=$(curl -s -D - http://127.0.0.1:8080/robots.txt -o /dev/null)
          echo "$ROBOTS_HEADERS" | grep -i "cache-control:.*max-age=3600"

      - name: Verify non-privileged user and read-only filesystem
        run: |
          # Container user must be UID 101 (nginx)
          UID_FOUND=$(docker exec preview_smoke id -u)
          if [ "$UID_FOUND" != "101" ]; then
            echo "Expected UID 101, found $UID_FOUND"
            exit 1
          fi

          # Root filesystem must be read-only
          if docker exec preview_smoke touch /etc/test_exploit 2>/dev/null; then
            echo "Root filesystem is writeable; expected read-only"
            exit 1
          fi

          # Build-only tools must be absent
          for tool in python python3 pip git gcc make; do
            if docker exec preview_smoke which $tool 2>/dev/null; then
              echo "Prohibited build tool '$tool' present in serving container"
              exit 1
            fi
          done

      - name: Stop preview container
        if: always()
        run: |
          docker stop preview_smoke || true

  fork-pr-isolation:
    name: Verify fork PR isolation and deploy credential protection (Task 4.1)
    runs-on: ubuntu-latest
    needs: [validate, docker-parity]
    steps:
      - name: Verify fork PR secret isolation
        run: |
          # Pull requests from forks must never receive repository secrets
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request event detected from: ${{ github.actor }}"
            echo "Confirmed: Workflow operates under read-only permissions with no deploy secrets."
          else
            echo "Push event on ${{ github.ref }}"
          fi

  # Deployment / Release Gate: Strictly gated to push on main, never on pull_request (Tasks 4.1, 4.4)
  deploy-gate:
    name: Production Release Gate (Human Gate G4)
    runs-on: ubuntu-latest
    needs: [validate, docker-parity, fork-pr-isolation]
    if: github.repository == 'c2ventures/elecciones2026' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Protected release execution gate
        run: |
          echo "Release gate passed for production repository on main branch."
          echo "Deploy credentials accessible strictly within protected environment on main push."
