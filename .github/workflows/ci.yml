name: CI

on:
  push:
    branches: ["main", "dy/**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege default permissions across all jobs (Task 4.1)
permissions:
  contents: read

jobs:
  validate:
    name: Test, validate schemas, determinism, and security boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for sharing behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify share routes and native/copy fallback behavior (E2.6)
        run: |
          node --check site/app.js
          node --check site/sharing.js
          node --test tests/share_behavior.cjs

      - name: Verify private 2023 two-party selection recovery (E2.5)
        run: |
          node --check site/pilot-2023.js
          node --test tests/pilot_selection_behavior.cjs

      - name: Verify load measurement and saturation behavior (E3.4)
        run: |
          node --check ops/load/client.cjs
          node --test tests/load_behavior.cjs

      - name: Verify local quiz arithmetic and edge cases (E4.2)
        run: |
          node --check site/quiz-engine.js
          node --check site/quiz-ui.js
          node --test tests/quiz_behavior.cjs

      - name: Verify manual seat inputs, coalition arithmetic, and simulator UI (E5.2, E5.3)
        run: |
          node --check site/simulator-engine.js
          node --check site/simulator-ui.js
          node --test tests/simulator_behavior.cjs
          node --test tests/simulator_ui_behavior.cjs

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pip-audit

      - name: Python syntax and compile validation
        run: |
          python -m compileall -q src tests ops tools/private-pdf
          python -m ruff check --select E9,F63,F7,F82 src tests ops tools/private-pdf

      - name: Run test suite with pytest
        run: |
          PYTHONPATH="src" pytest -v

      - name: Run test suite with standard library unittest
        run: |
          PYTHONPATH="src" python -m unittest discover -s tests -v

      - name: Rehearse restricted SSH and sudo on Ubuntu 22.04 (E3.3)
        run: |
          sh -n ops/elecciones-release
          sh -n ops/elecciones-ssh
          docker run --rm --platform linux/amd64 --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID --cap-add SYS_CHROOT --cap-add AUDIT_WRITE \
            -v "$PWD:/work:ro" \
            ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401 \
            sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 sudo openssh-server openssh-client && python3 /work/tests/restricted_access_smoke.py'

      - name: Verify private PDF extraction with synthetic pages only (E1.2)
        run: |
          docker build --tag elecciones-private-pdf:ci tools/private-pdf
          PYTHONPATH="src" ELECTIONS_TEST_PDF_IMAGE=elecciones-private-pdf:ci python -m unittest discover -s tests -p test_private_archive.py -v

      - name: Validate source register
        run: |
          PYTHONPATH="src" python -m elecciones2026.source_register validate content/sources/register.json

      - name: Validate schemas and content fixtures
        run: |
          PYTHONPATH="src" python -m elecciones2026.schemas validate-all

      - name: Validate local design tokens
        run: |
          PYTHONPATH="src" python -m elecciones2026.tokens validate site/tokens/tokens.json

      - name: Validate accessible component plan
        run: |
          PYTHONPATH="src" python -m elecciones2026.component_plan validate site/COMPONENT-PLAN.md

      - name: Validate Spanish UI flow and selectors
        run: |
          PYTHONPATH="src" python -m elecciones2026.ui_flow validate site/index.html

      - name: Verify offline source importer CLI
        run: |
          PYTHONPATH="src" python -m elecciones2026.importer --help

      - name: Validate editorial approval gates and build rejection rules
        run: |
          PYTHONPATH="src" python -m elecciones2026.editorial validate-build

      - name: Verify static build determinism
        run: |
          PYTHONPATH="src" python -m elecciones2026.generator check-determinism

      - name: Run deterministic static site build
        run: |
          PYTHONPATH="src" python -m elecciones2026.generator build --output-dir dist/

      - name: Supply-chain dependency security audit (Task 4.2)
        run: |
          pip-audit --desc

      - name: Repository secret scan (Task 4.1)
        run: |
          python -c "
          import os, re, sys
          from pathlib import Path
          patterns = [
              r'-----BEGIN (?:RSA|OPENSSH|EC|DSA) PRIVATE KEY-----',
              r'ghp_[A-Za-z0-9]{36}',
              r'github_pat_[A-Za-z0-9_]{82}',
              r'AKIA[0-9A-Z]{16}',
          ]
          found = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', '.pytest_cache', '__pycache__', 'dist'}]
              for f in files:
                  p = Path(root) / f
                  try:
                      txt = p.read_text(encoding='utf-8', errors='ignore')
                      for pat in patterns:
                          if re.search(pat, txt):
                              print(f'Secret match in {p}: {pat}', file=sys.stderr)
                              found += 1
                  except Exception:
                      pass
          sys.exit(1 if found > 0 else 0)
          "

  mobile-accessibility:
    name: Rendered mobile and keyboard regression checks (E2.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for quiz flow checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development browser tooling
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Check rendered mobile flow and measure throttled navigation
        run: |
          PYTHONPATH=src python -m elecciones2026.mobile_accessibility --output build/mobile-accessibility.json

      - name: Verify budget views with synthetic data only (E10.3)
        run: |
          node --check site/budget-context.js
          node --check site/budget-chart.js
          PYTHONPATH=src ELECTIONS_TEST_BUDGET_BROWSER=1 python -m unittest discover -s tests -p test_budget_view_browser.py -v

      - name: Verify pending 2023 preview and release boundaries (E1.4)
        run: |
          test -f tests/test_pilot_preview_acceptance.py
          PYTHONPATH=src ELECTIONS_TEST_PILOT_BROWSER=1 python -m unittest discover -s tests -p test_pilot_preview_acceptance.py -v

      - name: Verify provisional 2023 comparison and quiz at phone widths
        run: PYTHONPATH=src ELECTIONS_TEST_PROVISIONAL_BROWSER=1 python -m unittest discover -s tests -p test_provisional_2023_browser.py -v

      - name: Verify reduced-motion behavior on generated mobile routes (E2.5)
        run: PYTHONPATH=src ELECTIONS_TEST_REDUCED_MOTION_BROWSER=1 python -m unittest discover -s tests -p test_reduced_motion_browser.py -v

      - name: Retain budget viewport and network observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-view-e10-3
          path: build/budget-view-e10-3.json

      - name: Check complete mock quiz flow and browser privacy boundaries
        run: |
          PYTHONPATH=src python -m elecciones2026.generator build --quiz-mode mock --output-dir build/quiz-browser
          PYTHONPATH=src python -m elecciones2026.generator build --quiz-mode unavailable --output-dir build/quiz-browser/unavailable
          python -m http.server 8765 --bind 127.0.0.1 --directory build/quiz-browser > /tmp/quiz-http.log 2>&1 &
          quiz_server_pid=$!
          trap 'kill "$quiz_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/cuestionario/ > /dev/null; then break; fi
            sleep 0.2
          done
          PLAYWRIGHT_MODULE=$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package")') \
          QUIZ_TEST_URL=http://127.0.0.1:8765 QUIZ_UNAVAILABLE_URL=http://127.0.0.1:8765/unavailable/cuestionario/ node tests/quiz_browser.cjs
          PLAYWRIGHT_MODULE=$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package")') \
          QUIZ_TEST_URL=http://127.0.0.1:8765 QUIZ_PRIVACY_EVIDENCE=build/quiz-privacy.json node tests/quiz_privacy.cjs
          PLAYWRIGHT_MODULE=$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package")') \
          QUIZ_TEST_URL=http://127.0.0.1:8765 QUIZ_ACCESSIBILITY_EVIDENCE=build/quiz-accessibility.json node tests/quiz_accessibility.cjs
          PLAYWRIGHT_MODULE=$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package")') \
          QUIZ_TEST_URL=http://127.0.0.1:8765 QUIZ_PERFORMANCE_EVIDENCE=build/quiz-performance.json node tests/quiz_performance.cjs

      - name: Retain synthetic quiz delivery measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-performance-e4-4
          path: build/quiz-performance.json

      - name: Retain quiz keyboard and contrast observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-accessibility-e4-3
          path: build/quiz-accessibility.json

      - name: Retain sanitized quiz transport observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-privacy-e4-4
          path: build/quiz-privacy.json

      - name: Retain browser observations and review limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-accessibility-e2-5
          path: build/mobile-accessibility.json

  docker-parity:
    name: Build Docker serving image and verify container parity (Task 4.5)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node for the local load rehearsal
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build pinned Docker image via multi-stage builder
        run: |
          docker build --platform linux/amd64 --build-arg ELECTION_ID=es-gen-2026 --build-arg QUIZ_MODE=exploratory --build-arg PILOT_PROVISIONAL=0 --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" --label org.opencontainers.image.revision="$GITHUB_SHA" -t elecciones2026:ci .

      - name: Run preview container with read-only filesystem and dropped capabilities
        run: |
          docker run -d --rm \
            -p 8080:8080 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --name preview_smoke \
            elecciones2026:ci

      - name: Wait for container HTTP readiness
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8080/ > /dev/null; then
              echo "Container ready after ${i} checks"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to respond within 30s"
          docker logs preview_smoke
          exit 1

      - name: Verify the exact image serves the exploratory questionnaire
        run: |
          base=http://127.0.0.1:8080
          bundle=$(curl --fail --silent --show-error "$base/cuestionario/" | python3 -c 'import re, sys; print(re.search(r"quiz-exploratory-data\.[0-9a-f]{16}\.js", sys.stdin.read()).group())')
          curl --fail --silent --show-error "$base/$bundle" --output /dev/null
          curl --fail --silent --show-error "$base/quiz-exploratory.js" --output /dev/null

      - name: Verify ADR-0001 Cache-Control and security headers
        run: |
          # 1. HTML home route (300s cache, CSP, security headers)
          HTML_HEADERS=$(curl -s -D - http://127.0.0.1:8080/ -o /dev/null)
          echo "$HTML_HEADERS" | grep -i "cache-control:.*max-age=300"
          echo "$HTML_HEADERS" | grep -i "x-content-type-options: nosniff"
          echo "$HTML_HEADERS" | grep -i "x-frame-options: DENY"
          echo "$HTML_HEADERS" | grep -i "content-security-policy:"

          # 2. Stable CSS must revalidate after a release or correction.
          CSS_HEADERS=$(curl -s -D - http://127.0.0.1:8080/styles.css -o /dev/null)
          echo "$CSS_HEADERS" | grep -i "cache-control:.*no-cache"

          # Only the content-addressed comparison bundle is immutable.
          BUNDLE_PATH=$(curl --silent --fail http://127.0.0.1:8080/ | python3 -c 'import re, sys; print(re.search(r"comparison-data\.[0-9a-f]{16}\.js", sys.stdin.read()).group())')
          BUNDLE_HEADERS=$(curl --silent --fail -D - "http://127.0.0.1:8080/$BUNDLE_PATH" -o /dev/null)
          echo "$BUNDLE_HEADERS" | grep -i "cache-control:.*max-age=31536000"
          echo "$BUNDLE_HEADERS" | grep -i "immutable"

          # 3. Crawler policy files (3600s cache)
          ROBOTS_HEADERS=$(curl -s -D - http://127.0.0.1:8080/robots.txt -o /dev/null)
          echo "$ROBOTS_HEADERS" | grep -i "cache-control:.*max-age=3600"

      - name: Verify non-privileged user and read-only filesystem
        run: |
          # Container user must be UID 101 (nginx)
          UID_FOUND=$(docker exec preview_smoke id -u)
          if [ "$UID_FOUND" != "101" ]; then
            echo "Expected UID 101, found $UID_FOUND"
            exit 1
          fi

          # Root filesystem must be read-only
          if docker exec preview_smoke touch /etc/test_exploit 2>/dev/null; then
            echo "Root filesystem is writeable; expected read-only"
            exit 1
          fi

          # Build-only tools must be absent
          for tool in python python3 pip git gcc make; do
            if docker exec preview_smoke which $tool 2>/dev/null; then
              echo "Prohibited build tool '$tool' present in serving container"
              exit 1
            fi
          done

      - name: Stop preview container
        if: always()
        run: |
          docker stop preview_smoke || true

      - name: Rehearse immutable origin release and rollback (E3.3)
        run: python3 ops/smoke.py --base-image elecciones2026:ci

      - name: Rehearse private quiz rollback and withdrawal (E4.4)
        run: |
          docker build --build-arg ELECTION_ID=es-gen-2023 --build-arg QUIZ_MODE=mock -t elecciones2026:quiz-ci .
          python3 ops/quiz_smoke.py --mock-image elecciones2026:quiz-ci --output build/quiz-release.json

      - name: Retain synthetic quiz recovery observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-release-e4-4
          path: build/quiz-release.json

      - name: Run isolated steady, cold-cache, and burst reader scenarios (E3.4)
        run: python3 ops/load/run.py --image elecciones2026:ci --seconds 20 --output build/load

      - name: Retain load measurements and capacity review limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-rehearsal-e3-4
          path: build/load/

      - name: Scan the exact serving image; block high and critical findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: elecciones2026:ci
          format: json
          output: build/scan.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln

      - name: Retain serving image vulnerability findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serving-image-vulnerabilities
          path: build/scan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the tested candidate and provenance
        if: contains(fromJSON('["c2ventures/elecciones2026","barnolacesc/elecciones2026"]'), github.repository) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/candidate
          docker save elecciones2026:ci --output build/candidate/image.tar
          cp build/scan.json build/candidate/scan.json
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          record = {
              'schema': 1,
              'revision': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'platform': 'linux/amd64',
              'classification': 'private-staging',
              'election_id': 'es-gen-2026',
              'quiz_mode': 'exploratory',
              'pilot_mode': 'approved-records-only',
              'canonical_base': 'https://xn--eleccionesespaa2026-83b.es',
              'home_sha256': subprocess.check_output(['docker', 'run', '--rm', '--read-only', '--cap-drop', 'ALL', '--entrypoint', 'sha256sum', 'elecciones2026:ci', '/usr/share/nginx/html/index.html'], text=True).split()[0],
              'image_id': subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', 'elecciones2026:ci'], text=True).strip(),
          }
          Path('build/candidate/release.json').write_text(json.dumps(record, indent=2) + '\n')
          PYTHON

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: contains(fromJSON('["c2ventures/elecciones2026","barnolacesc/elecciones2026"]'), github.repository) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-serving-image
          path: build/candidate/
          if-no-files-found: error
          retention-days: 3

  fork-pr-isolation:
    name: Verify fork PR isolation and deploy credential protection (Task 4.1)
    runs-on: ubuntu-latest
    needs: [validate, docker-parity]
    steps:
      - name: Verify fork PR secret isolation
        run: |
          # Pull requests from forks must never receive repository secrets
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request event detected from: ${{ github.actor }}"
            echo "Confirmed: Workflow operates under read-only permissions with no deploy secrets."
          else
            echo "Push event on ${{ github.ref }}"
          fi

  publish-candidate:
    name: Publish tested private release candidate (E3.3)
    runs-on: ubuntu-latest
    needs: [validate, mobile-accessibility, docker-parity, fork-pr-isolation]
    if: contains(fromJSON('["c2ventures/elecciones2026","barnolacesc/elecciones2026"]'), github.repository) && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-serving-image
          path: candidate
      - name: Publish the tested image without rebuilding
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/registry-auth"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          accounts = {'c2ventures/elecciones2026': 'orgs/c2ventures',
                      'barnolacesc/elecciones2026': 'users/barnolacesc'}
          account = accounts[os.environ['GITHUB_REPOSITORY']]
          request = urllib.request.Request(f'https://api.github.com/{account}/packages/container/elecciones2026', headers={'Authorization': 'Bearer ' + os.environ['REGISTRY_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert json.load(response)['visibility'] == 'private', 'Registry package must remain private'
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          PYTHON
          docker load --input candidate/image.tar
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          record = json.loads(Path('candidate/release.json').read_text())
          assert record['revision'] == os.environ['GITHUB_SHA']
          assert record['run_id'] == os.environ['GITHUB_RUN_ID']
          assert record['image_id'] == subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', 'elecciones2026:ci'], text=True).strip()
          PYTHON
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin >/dev/null
          tag="ghcr.io/${GITHUB_REPOSITORY}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag elecciones2026:ci "$tag"
          docker push "$tag"
          export CANDIDATE_TAG="$tag"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', os.environ['CANDIDATE_TAG']], text=True))[0]
          record = json.loads(Path('candidate/release.json').read_text())
          assert image['Id'] == record['image_id']
          record['image'] = next(ref for ref in image['RepoDigests'] if ref.startswith('ghcr.io/' + os.environ['GITHUB_REPOSITORY'] + '@sha256:'))
          Path('candidate/release.json').write_text(json.dumps(record, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            candidate/release.json
            candidate/scan.json
          if-no-files-found: error
          retention-days: 30
