# Root-managed key file prevents the reused account from changing its SSH access.
Match User deployer
    AuthorizedKeysFile /etc/ssh/authorized_keys/deployer
    ForceCommand /usr/local/libexec/elecciones-ssh
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
Match all
