# Install instead of origin.conf while serving private candidates.
# The apex is deliberately not routed. Root owns the password file.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/elecciones2026/tls/origin.pem;
    ssl_certificate_key /etc/elecciones2026/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Official Cloudflare Origin Pull CA; never use the origin server cert here.
    ssl_client_certificate /etc/elecciones2026/tls/origin-pull-ca.pem;
    ssl_verify_client on;
    access_log off;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.xn--eleccionesespaa2026-83b.es;
    auth_basic "Private election staging";
    auth_basic_user_file /etc/elecciones2026/staging.htpasswd;
    server_tokens off;
    ssl_certificate /etc/elecciones2026/tls/origin.pem;
    ssl_certificate_key /etc/elecciones2026/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/elecciones2026/tls/origin-pull-ca.pem;
    ssl_verify_client on;
    access_log off;
    error_log /var/log/nginx/elecciones2026-error.log warn;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Enable HSTS only after all covered domains have verified TLS.
        # add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
