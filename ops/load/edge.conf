# Local cache fixture only. This is not a Cloudflare configuration.
proxy_cache_path /tmp/load-cache levels=1:2 keys_zone=load_cache:16m max_size=128m inactive=10m;
upstream load_origin {
    server load-origin:8080;
    keepalive 64;
}
server {
    listen 8080;
    server_name _;
    access_log off;
    location = /__load_ready {
        proxy_pass http://load_origin/__load_origin_ready;
        proxy_cache off;
    }
    location / {
        proxy_pass http://load_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache load_cache;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Load-Cache $upstream_cache_status always;
    }
}
